# kubelet image credential provider config, picked up by k3s from
# /var/lib/rancher/credentialprovider/config.yaml. kubelet execs
# /var/lib/rancher/credentialprovider/bin/ecr-credential-provider on the host
# for matching images; it uses the instance role and caches the token.
apiVersion: kubelet.config.k8s.io/v1
kind: CredentialProviderConfig
providers:
  - name: ecr-credential-provider
    apiVersion: credentialprovider.kubelet.k8s.io/v1
    matchImages:
      - "*.dkr.ecr.*.amazonaws.com"
    defaultCacheDuration: "12h"
