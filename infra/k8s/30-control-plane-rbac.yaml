# The control plane creates one namespace per app (app-<name>) and, inside
# it, Deployments, Services, Secrets, ResourceQuotas, LimitRanges,
# NetworkPolicies, Traefik IngressRoutes and (Faz 20) CronJobs and Jobs. Pods and pods/log are read to
# report rollout progress and crash logs. Namespaces are cluster-scoped and
# the app namespaces do not exist beforehand, hence a ClusterRole rather than
# per-namespace Roles.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paas
  namespace: paas
  labels:
    app.kubernetes.io/name: paas
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: paas-control-plane
  labels:
    app.kubernetes.io/name: paas
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, secrets, resourcequotas, limitranges, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  # Readiness tracking and runtime logs (Faz 5).
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  # Process types (Faz 20): workers are Deployments (above), cron jobs are
  # CronJobs; "run now" creates a Job from a CronJob's template, and the
  # status of the last run is read from its Jobs.
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  # networkpolicies: per-app isolation; ingresses: deployment and alias routes (Faz 4).
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  # Custom domains (Faz 12): certificate readiness of per-domain certificates
  # (cert-manager creates them from the Ingress annotation).
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, watch, create, update, patch, delete]
  # Scale to zero (Faz 11): a sleeping deployment's Service points at the
  # activator through an EndpointSlice paas maintains; the stale pod
  # endpoints are deleted.
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get, delete]
  # Live CPU/memory of app pods (Faz 19), served by metrics-server.
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
# Idle detection reads Traefik's Prometheus metrics through the API server's
# pod proxy; only in kube-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paas-traefik-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: paas
rules:
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paas-traefik-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: paas
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: paas-traefik-metrics
subjects:
  - kind: ServiceAccount
    name: paas
    namespace: paas
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: paas-control-plane
  labels:
    app.kubernetes.io/name: paas
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: paas-control-plane
subjects:
  - kind: ServiceAccount
    name: paas
    namespace: paas
