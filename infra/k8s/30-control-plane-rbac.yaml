# The control plane creates one namespace per app (app-<name>) and, inside
# it, Deployments, Services, Secrets, ResourceQuotas, LimitRanges,
# NetworkPolicies and Traefik IngressRoutes. Pods and pods/log are read to
# report rollout progress and crash logs. Namespaces are cluster-scoped and
# the app namespaces do not exist beforehand, hence a ClusterRole rather than
# per-namespace Roles.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paas
  namespace: paas
  labels:
    app.kubernetes.io/name: paas
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: paas-control-plane
  labels:
    app.kubernetes.io/name: paas
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, secrets, resourcequotas, limitranges, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  # Readiness tracking and runtime logs (Faz 5).
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  # networkpolicies: per-app isolation; ingresses: deployment and alias routes (Faz 4).
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: paas-control-plane
  labels:
    app.kubernetes.io/name: paas
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: paas-control-plane
subjects:
  - kind: ServiceAccount
    name: paas
    namespace: paas
