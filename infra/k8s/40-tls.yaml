# Wildcard TLS for every hostname of the platform: <domain> and *.<domain>
# (deployment URLs, production and preview aliases are all single labels).
#
# cert-manager solves DNS-01 in Route 53 with the node's instance role
# ("ambient credentials": no access keys in the cluster). The certificate
# lives next to Traefik in kube-system and is Traefik's default certificate,
# so app IngressRoutes only need `tls: {}`.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: ${ACME_SERVER}
    email: ${LETSENCRYPT_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          route53:
            region: ${AWS_REGION}
            hostedZoneID: ${HOSTED_ZONE_ID}
---
# Custom domains (Faz 12) are outside the Route 53 zone, so each gets its
# own certificate through HTTP-01. The control plane annotates a custom
# domain's Ingress with cert-manager.io/cluster-issuer: letsencrypt-http01
# (PAAS_CUSTOM_DOMAIN_ISSUER) and names a per-domain TLS Secret; the
# ingress-shim then creates the Certificate. The solver Ingress is served
# by Traefik on the plain-HTTP entry point, above the redirect below.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-http01
spec:
  acme:
    server: ${ACME_SERVER}
    email: ${LETSENCRYPT_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-http01-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
                  traefik.ingress.kubernetes.io/router.priority: "10000"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: kube-system
spec:
  secretName: wildcard-tls
  dnsNames:
    - "${DOMAIN}"
    - "*.${DOMAIN}"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default # Traefik only honours the store named "default"
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: wildcard-tls
---
# HTTP → HTTPS for every host: a lowest-priority catch-all on the "web"
# entry point. ACME HTTP-01 challenges are excluded so that Let's Encrypt
# reaches cert-manager's solver over plain HTTP (custom domains); the
# solver Ingress also has a higher priority.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: kube-system
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: redirect-https
  namespace: kube-system
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: PathPrefix(`/`) && !PathPrefix(`/.well-known/acme-challenge/`)
      priority: 1
      middlewares:
        - name: redirect-https
      services:
        # Never reached (the middleware answers); Traefik requires a service.
        - name: noop@internal
          kind: TraefikService
