# Wildcard TLS for every hostname of the platform: <domain> and *.<domain>
# (deployment URLs, production and preview aliases are all single labels).
#
# cert-manager solves DNS-01 in Route 53 with the node's instance role
# ("ambient credentials": no access keys in the cluster). The certificate
# lives next to Traefik in kube-system and is Traefik's default certificate,
# so app IngressRoutes only need `tls: {}`.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: ${ACME_SERVER}
    email: ${LETSENCRYPT_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          route53:
            region: ${AWS_REGION}
            hostedZoneID: ${HOSTED_ZONE_ID}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: kube-system
spec:
  secretName: wildcard-tls
  dnsNames:
    - "${DOMAIN}"
    - "*.${DOMAIN}"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default # Traefik only honours the store named "default"
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: wildcard-tls
---
# HTTP → HTTPS for every host: a lowest-priority catch-all on the "web"
# entry point.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: kube-system
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: redirect-https
  namespace: kube-system
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: PathPrefix(`/`)
      priority: 1
      middlewares:
        - name: redirect-https
      services:
        # Never reached (the middleware answers); Traefik requires a service.
        - name: noop@internal
          kind: TraefikService
