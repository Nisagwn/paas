# Per-host certificates through HTTP-01: custom domains (Faz 12), and every
# host when the platform runs without a wildcard (dns_provider = "duckdns",
# PAAS_INGRESS_CERT_ISSUER). The wildcard setup is in 41-tls-wildcard.yaml. The control plane annotates a custom
# domain's Ingress with cert-manager.io/cluster-issuer: letsencrypt-http01
# (PAAS_CUSTOM_DOMAIN_ISSUER) and names a per-domain TLS Secret; the
# ingress-shim then creates the Certificate. The solver Ingress is served
# by Traefik on the plain-HTTP entry point, above the redirect below.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-http01
spec:
  acme:
    server: ${ACME_SERVER}
    email: ${LETSENCRYPT_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-http01-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
                  traefik.ingress.kubernetes.io/router.priority: "10000"
---
# The control plane's host. Its own certificate in both setups: DNS-01 from
# "letsencrypt" with Route 53, HTTP-01 otherwise (APEX_ISSUER).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: paas-apex
  namespace: paas
spec:
  secretName: paas-apex-tls
  dnsNames:
    - "${DOMAIN}"
  issuerRef:
    kind: ClusterIssuer
    name: ${APEX_ISSUER}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
# HTTP → HTTPS for every host: a lowest-priority catch-all on the "web"
# entry point. ACME HTTP-01 challenges are excluded so that Let's Encrypt
# reaches cert-manager's solver over plain HTTP (custom domains); the
# solver Ingress also has a higher priority.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: kube-system
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: redirect-https
  namespace: kube-system
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: PathPrefix(`/`) && !PathPrefix(`/.well-known/acme-challenge/`)
      priority: 1
      middlewares:
        - name: redirect-https
      services:
        # Never reached (the middleware answers); Traefik requires a service.
        - name: noop@internal
          kind: TraefikService

