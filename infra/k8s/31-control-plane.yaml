# minipaas control plane: API + GitHub webhook + build/deploy workers.
# Secrets used here are created on the node, not stored in this repo:
#   minipaas/minipaas          database-url, api-token, github-webhook-secret
#                              (+ optional github-token for private repos)
#   minipaas/ecr-docker-config config.json for buildctl, refreshed every 6 h
#                              by the minipaas-ecr-auth systemd timer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minipaas
  namespace: minipaas
  labels:
    app.kubernetes.io/name: minipaas
    app.kubernetes.io/part-of: minipaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minipaas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minipaas
        app.kubernetes.io/part-of: minipaas
    spec:
      serviceAccountName: minipaas
      securityContext:
        runAsUser: 65532 # matches the Dockerfile
        runAsGroup: 65532
        fsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minipaas
          image: ${CONTROL_PLANE_IMAGE}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MINIPAAS_ADDR
              value: ":8080"
            - name: MINIPAAS_DOMAIN
              value: "${DOMAIN}"
            - name: MINIPAAS_WORKERS
              value: "2"
            - name: MINIPAAS_BUILDER
              value: buildkit
            - name: MINIPAAS_BUILDKIT_ADDR
              value: tcp://buildkitd.minipaas:1234
            - name: MINIPAAS_REGISTRY
              value: "${MINIPAAS_REGISTRY}"
            - name: MINIPAAS_REGISTRY_INSECURE
              value: "false"
            - name: MINIPAAS_BUILD_PLATFORM
              value: linux/arm64
            # Off until the registry cache export sets image-manifest=true,
            # which ECR requires (see infra/README.md, open issues).
            - name: MINIPAAS_BUILD_CACHE
              value: "false"
            - name: MINIPAAS_DEPLOYER
              value: "${MINIPAAS_DEPLOYER}"
            - name: MINIPAAS_DEPLOY_TIMEOUT
              value: 15m
            # Per-app resources keep their defaults (internal/config): 25m/500m CPU,
            # 64Mi/256Mi memory per pod; quota 1 CPU requests, 4Gi memory, 20 pods.
            - name: MINIPAAS_ROLLOUT_TIMEOUT
              value: 3m
            - name: MINIPAAS_APP_RUN_AS_NON_ROOT
              value: "true"
            # App routes: plain Ingress objects served by k3s's Traefik, TLS
            # from the default wildcard certificate (40-tls.yaml).
            - name: MINIPAAS_INGRESS_CLASS
              value: traefik
            - name: MINIPAAS_INGRESS_TLS
              value: "true"
            - name: MINIPAAS_ROUTE_SYNC_INTERVAL
              value: 1m
            - name: MINIPAAS_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: minipaas, key: database-url }
            - name: MINIPAAS_API_TOKEN
              valueFrom:
                secretKeyRef: { name: minipaas, key: api-token }
            - name: MINIPAAS_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: minipaas, key: github-webhook-secret }
            - name: MINIPAAS_GITHUB_TOKEN
              valueFrom:
                secretKeyRef: { name: minipaas, key: github-token, optional: true }
            # buildctl (docker/cli config loader) reads $DOCKER_CONFIG/config.json.
            - name: DOCKER_CONFIG
              value: /docker-config
            # Read-only root filesystem: git and buildctl write under $HOME/$TMPDIR.
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: docker-config
              mountPath: /docker-config
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi # cloned repositories
        # Mounted without subPath so token refreshes propagate to the pod.
        - name: docker-config
          secret:
            secretName: ecr-docker-config
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: minipaas
  namespace: minipaas
  labels:
    app.kubernetes.io/name: minipaas
spec:
  selector:
    app.kubernetes.io/name: minipaas
  ports:
    - name: http
      port: 80
      targetPort: http
---
# API and GitHub webhook at the apex domain. Apps own every single-label
# subdomain (<app>.<domain>), so "api.<domain>" would collide with an app
# named "api". TLS comes from Traefik's default TLSStore (40-tls.yaml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minipaas
  namespace: minipaas
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`${DOMAIN}`)
      services:
        - name: minipaas
          port: 80
  tls: {}
