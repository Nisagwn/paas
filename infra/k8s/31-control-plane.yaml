# paas control plane: API + GitHub webhook + build/deploy workers.
# Secrets used here are created on the node, not stored in this repo:
#   paas/paas          database-url, api-token, github-webhook-secret, env-key
#                              (+ optional github-token for private repos,
#                              optional env-old-keys during a key rotation,
#                              optional GitHub App: github-app-id,
#                              github-app-slug, github-app-private-key and
#                              github-oauth-client-id/-secret for its login)
#   paas/ecr-docker-config config.json for buildctl, refreshed every 6 h
#                              by the paas-ecr-auth systemd timer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paas
  namespace: paas
  labels:
    app.kubernetes.io/name: paas
    app.kubernetes.io/part-of: paas
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paas
        app.kubernetes.io/part-of: paas
    spec:
      serviceAccountName: paas
      securityContext:
        runAsUser: 65532 # matches the Dockerfile
        runAsGroup: 65532
        fsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paas
          image: ${CONTROL_PLANE_IMAGE}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            # Scale to zero: Traefik reaches the activator at <pod IP>:8081
            # through the EndpointSlice of a sleeping deployment's Service.
            - name: activator
              containerPort: 8081
          env:
            - name: PAAS_ADDR
              value: ":8080"
            - name: PAAS_DOMAIN
              value: "${DOMAIN}"
            - name: PAAS_WORKERS
              value: "2"
            - name: PAAS_BUILDER
              value: buildkit
            - name: PAAS_BUILDKIT_ADDR
              value: tcp://buildkitd.paas:1234
            - name: PAAS_REGISTRY
              value: "${PAAS_REGISTRY}"
            - name: PAAS_REGISTRY_INSECURE
              value: "false"
            - name: PAAS_BUILD_PLATFORM
              value: linux/arm64
            # Off until the registry cache export sets image-manifest=true,
            # which ECR requires (see infra/README.md, open issues).
            - name: PAAS_BUILD_CACHE
              value: "false"
            - name: PAAS_DEPLOYER
              value: "${PAAS_DEPLOYER}"
            - name: PAAS_DEPLOY_TIMEOUT
              value: 15m
            # Per-app resources keep their defaults (internal/config): 25m/500m CPU,
            # 64Mi/256Mi memory per pod; quota 1 CPU requests, 4Gi memory, 20 pods.
            - name: PAAS_ROLLOUT_TIMEOUT
              value: 3m
            - name: PAAS_APP_RUN_AS_NON_ROOT
              value: "true"
            # App routes: plain Ingress objects served by k3s's Traefik, TLS
            # from the default wildcard certificate (41-tls-wildcard.yaml) or
            # per host (PAAS_INGRESS_CERT_ISSUER).
            - name: PAAS_INGRESS_CLASS
              value: traefik
            - name: PAAS_INGRESS_TLS
              value: "true"
            # Empty: the wildcard certificate. Otherwise one certificate per
            # host from this ClusterIssuer (DuckDNS setup).
            - name: PAAS_INGRESS_CERT_ISSUER
              value: "${INGRESS_CERT_ISSUER}"
            - name: PAAS_ROUTE_SYNC_INTERVAL
              value: 1m
            # Scale to zero (Faz 11): idle deployments sleep after 30m; the
            # activator wakes them and proxies the held request to the pod.
            - name: PAAS_SCALE_TO_ZERO_AFTER
              value: 30m
            - name: PAAS_ACTIVATOR_ADDR
              value: ":8081"
            - name: PAAS_ACTIVATOR_UPSTREAM
              value: pod
            - name: PAAS_ACTIVATOR_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            # App NetworkPolicies admit the control plane (activator → pod).
            - name: PAAS_CONTROL_PLANE_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: PAAS_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: paas, key: database-url }
            - name: PAAS_API_TOKEN
              valueFrom:
                secretKeyRef: { name: paas, key: api-token }
            - name: PAAS_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: paas, key: github-webhook-secret }
            - name: PAAS_GITHUB_TOKEN
              valueFrom:
                secretKeyRef: { name: paas, key: github-token, optional: true }
            # Faz 15: GitHub App. All optional: without them the control plane
            # runs on github-token and per-repository webhooks as before. The
            # private key is a file (multi-line PEM); a missing key leaves the
            # file absent, which counts as unset.
            - name: PAAS_GITHUB_APP_ID
              valueFrom:
                secretKeyRef: { name: paas, key: github-app-id, optional: true }
            - name: PAAS_GITHUB_APP_SLUG
              valueFrom:
                secretKeyRef: { name: paas, key: github-app-slug, optional: true }
            - name: PAAS_GITHUB_APP_PRIVATE_KEY_FILE
              value: /etc/paas/github-app/private-key.pem
            # GitHub login through the App (its client id and secret).
            - name: PAAS_GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: paas, key: github-oauth-client-id, optional: true }
            - name: PAAS_OPEN_SIGNUP
              valueFrom:
                secretKeyRef: { name: paas, key: open-signup, optional: true }
            - name: PAAS_ADMIN_GITHUB_LOGINS
              valueFrom:
                secretKeyRef: { name: paas, key: admin-github-logins, optional: true }
            - name: PAAS_GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: paas, key: github-oauth-client-secret, optional: true }
            # Faz 10: AES-256 key for app env values (bootstrap.sh generates it).
            - name: PAAS_ENV_KEY
              valueFrom:
                secretKeyRef: { name: paas, key: env-key }
            - name: PAAS_ENV_OLD_KEYS
              valueFrom:
                secretKeyRef: { name: paas, key: env-old-keys, optional: true }
            # buildctl (docker/cli config loader) reads $DOCKER_CONFIG/config.json.
            - name: DOCKER_CONFIG
              value: /docker-config
            # Read-only root filesystem: git and buildctl write under $HOME/$TMPDIR.
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: docker-config
              mountPath: /docker-config
              readOnly: true
            - name: github-app
              mountPath: /etc/paas/github-app
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi # cloned repositories
        # Mounted without subPath so token refreshes propagate to the pod.
        - name: docker-config
          secret:
            secretName: ecr-docker-config
            defaultMode: 0440
        - name: github-app
          secret:
            secretName: paas
            optional: true
            items:
              - key: github-app-private-key
                path: private-key.pem
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: paas
  namespace: paas
  labels:
    app.kubernetes.io/name: paas
spec:
  selector:
    app.kubernetes.io/name: paas
  ports:
    - name: http
      port: 80
      targetPort: http
---
# API and GitHub webhook at the apex domain. Apps own every single-label
# subdomain (<app>.<domain>), so "api.<domain>" would collide with an app
# named "api". TLS comes from Traefik's default TLSStore (40-tls.yaml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paas
  namespace: paas
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`${DOMAIN}`)
      services:
        - name: paas
          port: 80
  tls:
    secretName: paas-apex-tls # 40-tls.yaml
