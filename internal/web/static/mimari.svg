<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" role="img" aria-labelledby="t d">
  <title id="t">paas genel mimari</title>
  <desc id="d">Geliştirici GitHub'a push eder; GitHub webhook'u Traefik üzerinden kontrol düzlemine gelir. Kontrol düzlemi PostgreSQL'i kuyruk ve durum için kullanır, kodu çeker, buildkitd ile imajı derleyip ECR'a iter ve uygulamanın namespace'inde değişmez deploy'lar oluşturur. Son kullanıcı istekleri Traefik ile alias ve deploy adreslerine yönlenir.</desc>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .h { font-size: 13px; font-weight: 600; }
      .s { font-size: 11px; fill: #475569; }
      .l { font-size: 11px; fill: #334155; }
      .ttl { font-size: 18px; font-weight: 700; }
      .grp { font-size: 12px; font-weight: 600; fill: #334155; }
      .ext { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.2; }
      .edge { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.2; }
      .cp { fill: #ffffff; stroke: #4f46e5; stroke-width: 1.4; }
      .app { fill: #ffffff; stroke: #059669; stroke-width: 1.2; }
      .a { fill: none; stroke: #334155; stroke-width: 1.4; marker-end: url(#ok); }
      .ab { fill: none; stroke: #334155; stroke-width: 1.4; marker-end: url(#ok); marker-start: url(#ok); }
      .ad { fill: none; stroke: #334155; stroke-width: 1.3; stroke-dasharray: 5 4; marker-end: url(#ok); }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="650" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="24" y="36" class="ttl">paas — genel mimari</text>
  <text x="232" y="62" class="grp">AWS EC2 t4g.medium (arm64) · tek düğümlü k3s kümesi</text>

  <!-- cluster -->
  <rect x="232" y="72" width="520" height="556" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>

  <!-- left column: actors and external services -->
  <rect x="20" y="96" width="150" height="56" rx="10" class="ext"/>
  <text x="95" y="120" class="h" text-anchor="middle">Geliştirici</text>
  <text x="95" y="138" class="s" text-anchor="middle">git push · web · CLI</text>

  <rect x="20" y="240" width="150" height="112" rx="10" class="ext"/>
  <text x="95" y="266" class="h" text-anchor="middle">GitHub</text>
  <text x="95" y="286" class="s" text-anchor="middle">repo · GitHub App</text>
  <text x="95" y="303" class="s" text-anchor="middle">OAuth girişi</text>
  <text x="95" y="320" class="s" text-anchor="middle">commit status</text>
  <text x="95" y="337" class="s" text-anchor="middle">PR yorumu</text>

  <rect x="20" y="392" width="150" height="56" rx="10" class="ext"/>
  <text x="95" y="416" class="h" text-anchor="middle">Son kullanıcı</text>
  <text x="95" y="434" class="s" text-anchor="middle">tarayıcı</text>

  <rect x="20" y="476" width="150" height="52" rx="10" class="ext"/>
  <text x="95" y="498" class="h" text-anchor="middle">Let's Encrypt</text>
  <text x="95" y="516" class="s" text-anchor="middle">ACME</text>

  <rect x="20" y="548" width="150" height="60" rx="10" class="ext"/>
  <text x="95" y="572" class="h" text-anchor="middle">Route 53 / DuckDNS</text>
  <text x="95" y="591" class="s" text-anchor="middle">&lt;domain&gt; · *.&lt;domain&gt;</text>

  <!-- Traefik and cert-manager -->
  <rect x="248" y="108" width="100" height="360" rx="10" class="edge"/>
  <text x="298" y="250" class="h" text-anchor="middle">Traefik</text>
  <text x="298" y="268" class="s" text-anchor="middle">kube-system</text>
  <text x="298" y="292" class="s" text-anchor="middle">Ingress + CRD</text>
  <text x="298" y="308" class="s" text-anchor="middle">TLS (wildcard)</text>
  <text x="298" y="324" class="s" text-anchor="middle">ForwardAuth</text>
  <text x="298" y="340" class="s" text-anchor="middle">ağırlıklı servis</text>
  <text x="298" y="356" class="s" text-anchor="middle">metrikler</text>

  <rect x="248" y="484" width="100" height="108" rx="10" class="edge"/>
  <text x="298" y="526" class="h" text-anchor="middle">cert-manager</text>
  <text x="298" y="546" class="s" text-anchor="middle">sertifika</text>
  <text x="298" y="562" class="s" text-anchor="middle">üretimi</text>

  <!-- namespace paas -->
  <rect x="364" y="108" width="372" height="268" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="376" y="126" class="grp">namespace: paas</text>
  <rect x="380" y="136" width="340" height="104" rx="10" class="cp"/>
  <text x="550" y="158" class="h" text-anchor="middle">Kontrol düzlemi · tek Go ikilisi (cmd/paas)</text>
  <text x="550" y="178" class="l" text-anchor="middle">API · web arayüzü (htmx) · webhook · ForwardAuth</text>
  <text x="550" y="195" class="l" text-anchor="middle">worker havuzu · aktivatör :8081 · tarayıcı terminali</text>
  <text x="550" y="212" class="s" text-anchor="middle">döngüler: yönlendirme · GC · alan adı · ölçekleme ·</text>
  <text x="550" y="228" class="s" text-anchor="middle">yayın · eklenti · bildirim · analitik · proje silme</text>

  <rect x="380" y="268" width="150" height="92" rx="10" class="cp"/>
  <text x="455" y="296" class="h" text-anchor="middle">PostgreSQL</text>
  <text x="455" y="316" class="s" text-anchor="middle">tek doğruluk kaynağı</text>
  <text x="455" y="332" class="s" text-anchor="middle">kuyruk · log · outbox</text>
  <text x="455" y="348" class="s" text-anchor="middle">LISTEN / NOTIFY</text>

  <rect x="570" y="268" width="150" height="92" rx="10" class="cp"/>
  <text x="645" y="296" class="h" text-anchor="middle">buildkitd</text>
  <text x="645" y="316" class="s" text-anchor="middle">rootless BuildKit</text>
  <text x="645" y="332" class="s" text-anchor="middle">build önbelleği (PVC)</text>

  <!-- namespace app -->
  <rect x="364" y="392" width="372" height="200" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="376" y="410" class="grp">namespace: app-&lt;ad&gt; (uygulama başına)</text>
  <rect x="380" y="420" width="150" height="64" rx="10" class="app"/>
  <text x="455" y="444" class="h" text-anchor="middle">d-&lt;sha7&gt; (yeni)</text>
  <text x="455" y="462" class="s" text-anchor="middle">Deployment · Service</text>
  <text x="455" y="476" class="s" text-anchor="middle">Ingress · env Secret</text>
  <rect x="570" y="420" width="150" height="64" rx="10" class="app"/>
  <text x="645" y="444" class="h" text-anchor="middle">d-&lt;sha7'&gt; (önceki)</text>
  <text x="645" y="462" class="s" text-anchor="middle">hâlâ çalışıyor:</text>
  <text x="645" y="476" class="s" text-anchor="middle">anlık rollback hedefi</text>
  <rect x="380" y="496" width="150" height="84" rx="10" class="app"/>
  <text x="455" y="518" class="h" text-anchor="middle">Alias Ingress'leri</text>
  <text x="455" y="537" class="s" text-anchor="middle">&lt;ad&gt;.&lt;domain&gt;</text>
  <text x="455" y="553" class="s" text-anchor="middle">&lt;branch&gt;-&lt;ad&gt;.&lt;domain&gt;</text>
  <text x="455" y="569" class="s" text-anchor="middle">özel alan adları</text>
  <rect x="570" y="496" width="150" height="84" rx="10" class="app"/>
  <text x="645" y="518" class="h" text-anchor="middle">Eklentiler</text>
  <text x="645" y="537" class="s" text-anchor="middle">Postgres / Redis</text>
  <text x="645" y="553" class="s" text-anchor="middle">StatefulSet + PVC</text>
  <text x="645" y="569" class="s" text-anchor="middle">worker · cron</text>

  <!-- right column -->
  <rect x="790" y="120" width="150" height="72" rx="10" class="ext"/>
  <text x="865" y="144" class="h" text-anchor="middle">Bildirim kanalları</text>
  <text x="865" y="163" class="s" text-anchor="middle">Slack · Discord</text>
  <text x="865" y="179" class="s" text-anchor="middle">e-posta · webhook</text>

  <rect x="790" y="280" width="150" height="64" rx="10" class="ext"/>
  <text x="865" y="306" class="h" text-anchor="middle">Amazon ECR</text>
  <text x="865" y="325" class="s" text-anchor="middle">&lt;app&gt;:&lt;sha&gt;@digest</text>

  <!-- legend -->
  <line x1="776" y1="560" x2="812" y2="560" class="a"/>
  <text x="820" y="564" class="s">istek / çağrı</text>
  <line x1="776" y1="584" x2="812" y2="584" class="ad"/>
  <text x="820" y="588" class="s">imaj çekme</text>

  <!-- arrows -->
  <line x1="95" y1="152" x2="95" y2="236" class="a"/>
  <text x="103" y="198" class="l">git push</text>

  <line x1="170" y1="330" x2="246" y2="330" class="a"/>
  <text x="209" y="322" class="l" text-anchor="middle">webhook</text>

  <path d="M420,136 V90 H200 V270 H174" class="a"/>
  <text x="300" y="104" class="s">clone (SHA) · status · PR yorumu</text>

  <line x1="170" y1="420" x2="246" y2="420" class="a"/>
  <text x="209" y="412" class="l" text-anchor="middle">HTTPS</text>

  <line x1="248" y1="502" x2="174" y2="502" class="a"/>
  <text x="209" y="494" class="s" text-anchor="middle">ACME</text>
  <line x1="248" y1="578" x2="174" y2="578" class="a"/>
  <text x="209" y="570" class="s" text-anchor="middle">DNS-01</text>

  <line x1="348" y1="194" x2="378" y2="194" class="a"/>
  <line x1="348" y1="452" x2="378" y2="452" class="a"/>

  <line x1="455" y1="240" x2="455" y2="266" class="ab"/>
  <text x="463" y="258" class="s">SQL</text>
  <line x1="645" y1="240" x2="645" y2="266" class="a"/>
  <text x="653" y="258" class="s">buildctl</text>

  <line x1="550" y1="240" x2="550" y2="390" class="a"/>
  <text x="546" y="316" class="s" text-anchor="middle" transform="rotate(-90 546 316)">Kubernetes API</text>

  <line x1="720" y1="160" x2="788" y2="160" class="a"/>
  <text x="756" y="152" class="s" text-anchor="middle">olaylar</text>

  <line x1="720" y1="314" x2="788" y2="314" class="a"/>
  <text x="756" y="306" class="s" text-anchor="middle">push</text>

  <path d="M790,336 H764 V452 H722" class="ad"/>
  <text x="770" y="400" class="s" transform="rotate(90 770 400)" text-anchor="middle">pull</text>
</svg>
