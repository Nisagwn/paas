services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minipaas
      POSTGRES_PASSWORD: minipaas
      POSTGRES_DB: minipaas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minipaas"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
